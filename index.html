<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <form action="" class="theme-switcher">
        <label for="light">
          <input type="radio" name="theme" id="light" value="light" checked />
          Light
        </label>

        <label for="dark">
          <input type="radio" name="theme" id="dark" value="dark" />
          Dark
        </label>
        <label for="custom">
          <input type="radio" name="theme" id="custom" value="custom" />
          Custom
        </label>
      </form>
    </header>
    <main>
      <article>
        <h1>Hello, World!</h1>
        <p>This is a simple card that changes theme with CSS variables.</p>
        <button>Primary Button</button>
      </article>
    </main>
    <footer>
      &copy; <time datetime="2026">2026</time> All rights reserved
    </footer>
  </body>
</html>
